<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked War End Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ranked War End Time</h1>
        
        <div id="setup-area">
            <input type="text" id="api-key" placeholder="Enter API Key">
            <button onclick="startTracking()">Start Tracking</button>
        </div>

        <div id="active-controls" class="hidden">
            <button class="secondary" onclick="updateWarClock()">Update Now</button>
            <button class="secondary" onclick="location.reload()">Clear / Change Key</button>
        </div>

        <h2 id="war-title">Awaiting API Key...</h2>

        <div id="dashboard" class="hidden">
            <div class="timer" id="countdown">00:00:00</div>
            
            <div class="stats-grid">
                <div class="faction-card">
                    <div id="f1-name" class="faction-name">Faction 1</div>
                    <div id="f1-score" class="score">0</div>
                </div>
                <div class="faction-card">
                    <div id="f2-name" class="faction-name">Faction 2</div>
                    <div id="f2-score" class="score">0</div>
                </div>
            </div>

            <div class="progress-container">
                <div id="victory-bar" class="progress-bar">0% TO VICTORY</div>
            </div>

            <div id="details"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
