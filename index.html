<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn War Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #e0e0e0; text-align: center; padding: 20px; }
        .container { background: #2c2c2c; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 90%; }
        input { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; width: 250px; margin-bottom: 10px; }
        button { padding: 10px 20px; border-radius: 4px; border: none; background: #3772ff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2558d6; }
        .timer { font-size: 3.5em; color: #ff4747; margin: 20px 0; font-family: monospace; font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; border-top: 1px solid #444; padding-top: 20px; }
        .faction-name { color: #3772ff; font-size: 1.2em; margin-bottom: 5px; }
        .score { font-size: 1.5em; font-weight: bold; }
        .decay-note { font-size: 0.9em; color: #888; margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ranked War Predictor</h1>
        
        <div>
            <input type="password" id="api-key" placeholder="Enter API Key (Limited+)">
            <button onclick="saveKey()">Start Tracking</button>
        </div>

        <h2 id="war-title">Enter Key to Begin</h2>
        <div class="timer" id="countdown">--:--:--</div>
        
        <div class="stats-grid" id="stats-area" style="display: none;">
            <div>
                <div id="f1-name" class="faction-name">Faction 1</div>
                <div id="f1-score" class="score">0</div>
            </div>
            <div>
                <div id="f2-name" class="faction-name">Faction 2</div>
                <div id="f2-score" class="score">0</div>
            </div>
        </div>

        <div id="details" style="margin-top: 20px; color: #bbb;"></div>
        <p class="decay-note">*Calculations assume no further hits are made by either side.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
