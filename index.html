<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn War Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #e0e0e0; text-align: center; padding: 20px; }
        .container { background: #2c2c2c; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.5); min-width: 400px; }
        input { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; width: 200px; margin-bottom: 10px; font-family: monospace; }
        button { padding: 10px 15px; border-radius: 4px; border: none; background: #3772ff; color: white; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #2558d6; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        .timer { font-size: 3.5em; color: #ff4747; margin: 20px 0; font-family: monospace; font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; border-top: 1px solid #444; padding-top: 20px; }
        .faction-name { color: #3772ff; font-size: 1.2em; margin-bottom: 5px; font-weight: bold; }
        .score { font-size: 1.5em; font-weight: bold; }
        #details { line-height: 1.6; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ranked War Predictor</h1>
        
        <div id="setup-area">
            <input type="text" id="api-key" placeholder="Enter API Key">
            <button onclick="startTracking()">Start Tracking</button>
        </div>

        <div id="active-controls" style="display:none; margin-bottom: 20px;">
            <button class="secondary" onclick="updateWarClock()">Update Now</button>
            <button class="secondary" onclick="location.reload()">Clear / Change Key</button>
        </div>

        <h2 id="war-title">Awaiting API Key...</h2>
        <div class="timer" id="countdown">--:--:--</div>
        
        <div class="stats-grid" id="stats-area" style="display: none;">
            <div>
                <div id="f1-name" class="faction-name">Faction 1</div>
                <div id="f1-score" class="score">0</div>
            </div>
            <div>
                <div id="f2-name" class="faction-name">Faction 2</div>
                <div id="f2-score" class="score">0</div>
            </div>
        </div>

        <div id="details"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
