<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranked War End Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="header-title">Ranked War End Time</h1>
        
        <div id="setup-area">
            <input type="text" id="api-key" placeholder="Enter API Key">
            <button onclick="startTracking()">Start Tracking</button>
        </div>

        <div id="dashboard" class="hidden">
            <div class="timer" id="countdown">00:00:00</div>
            <div id="orig-target-display" class="original-target-text">Original Target: 0</div>
            
            <div class="stats-grid">
                <div class="faction-card">
                    <div id="f1-name" class="faction-name">Faction 1</div>
                    <div id="f1-score" class="score">0</div>
                </div>
                <div class="faction-card">
                    <div id="f2-name" class="faction-name">Faction 2</div>
                    <div id="f2-score" class="score">0</div>
                </div>
            </div>

            <div class="tow-wrapper">
                <div class="tow-labels-top">
                    <span id="label-f1">F1</span>
                    <span id="label-f2">F2</span>
                </div>
                <div class="tow-container">
                    <div class="tow-center-line"></div>
                    <div class="tow-side tow-left">
                        <div id="fill-left" class="fill-left"></div>
                        <div id="val-left" class="tow-value"></div>
                    </div>
                    <div class="tow-side tow-right">
                        <div id="val-right" class="tow-value"></div>
                        <div id="fill-right" class="fill-right"></div>
                    </div>
                </div>
                <div class="tow-labels-bottom">
                    <span id="target-left">0</span>
                    <span class="center-zero">0</span>
                    <span id="target-right">0</span>
                </div>
            </div>

            <div id="details"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
